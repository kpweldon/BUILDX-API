name: Nightly YouTube ingest + Descript transcribe

on:
  schedule:
    # 07:00 UTC daily = midnight PT / 03:00 ET. Adjust as needed.
    - cron: "0 7 * * *"
  workflow_dispatch: {}
  push:
    branches:
      - claude/descript-api-integration-wXav5
    paths:
      - "descript_api/**"
      - "scripts/**"
      - "config/channels.txt"
      - "requirements.txt"
      - ".github/workflows/nightly-transcribe.yml"

jobs:
  ingest-and-transcribe:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      DESCRIPT_API_KEY: ${{ secrets.DESCRIPT_API_KEY }}
      DESCRIPT_API_BASE_URL: ${{ vars.DESCRIPT_API_BASE_URL }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install ffmpeg (for yt-dlp postprocessing)
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install Python deps
        run: pip install -r requirements.txt

      - name: Restore ingest state cache
        uses: actions/cache@v4
        with:
          path: data/.state
          key: yt-ingest-state-${{ github.run_id }}
          restore-keys: |
            yt-ingest-state-

      - name: Ingest YouTube + transcribe via Descript
        run: python scripts/ingest_youtube.py

      - name: Upload transcripts artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: transcripts-${{ github.run_id }}
          path: out/
          if-no-files-found: ignore
          retention-days: 14
