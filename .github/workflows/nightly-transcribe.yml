name: Nightly Descript batch transcribe

on:
  schedule:
    # 07:00 UTC daily = midnight PT / 03:00 ET. Adjust as needed.
    - cron: "0 7 * * *"
  workflow_dispatch: {}

jobs:
  transcribe:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      DESCRIPT_API_KEY: ${{ secrets.DESCRIPT_API_KEY }}
      DESCRIPT_API_BASE_URL: ${{ vars.DESCRIPT_API_BASE_URL }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Run batch transcribe
        run: python scripts/batch_transcribe.py --input ./data --output ./out

      - name: Upload transcripts artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: transcripts-${{ github.run_id }}
          path: out/
          if-no-files-found: ignore
          retention-days: 14
